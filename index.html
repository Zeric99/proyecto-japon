<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>Proyecto Japón</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24211e;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center}header{padding:clamp(2.5rem,7vh,5rem) 1rem 0}h1{font-size:clamp(.85rem,2vw,1rem);letter-spacing:.25em;text-transform:uppercase;font-weight:600;margin:0}.sun{display:block;width:12px;height:12px;border:0;padding:0;border-radius:50%;background:#bc3b3b;margin:0 auto 1.4rem;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}.sun:focus-visible{outline:2px solid #bc3b3b;outline-offset:4px}.sun.active{position:fixed;margin:0;width:36px;height:36px;z-index:8;touch-action:manipulation;box-shadow:inset -4px -5px 0 #0002,0 3px 6px #0002}main{flex:1;display:grid;place-content:center;padding:1rem 1rem 10vh}.number{font-size:clamp(4rem,18vw,16rem);font-weight:700;line-height:1;letter-spacing:-.075em;font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:.34em;letter-spacing:0;margin-left:.1em;color:#bc3b3b}footer{padding:0 1rem 2.5rem;color:#77716a;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}

body{overflow:hidden} header,main,footer{position:relative;z-index:2;pointer-events:none}.face{position:fixed;left:0;top:0;width:clamp(70px, 11vw, 135px);height:clamp(70px, 11vw, 135px);z-index:3;will-change:transform;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;padding:0;border:0;background:transparent}.face img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px #0002)}.face.hit img{animation:squish .3s ease-out}.spark{position:fixed;width:18px;height:18px;border:2px solid #bc3b3b;border-radius:50%;pointer-events:none;z-index:3;animation:pop .45s ease-out forwards}@keyframes squish{0%{transform:scale(.72,1.18)}55%{transform:scale(1.13,.9)}100%{transform:scale(1)}}@keyframes pop{from{opacity:.8;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}@media(max-width:600px){.number{font-size:clamp(5rem,29vw,11rem)}.face{width:clamp(135px,36vw,200px);height:clamp(135px,36vw,200px)}}@media(prefers-reduced-motion:reduce){.face.hit img,.spark{animation:none}}

footer{pointer-events:auto;z-index:5}.chart-toggle{font:inherit;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:#fff;color:#24211e;border:1px solid #d8d2cc;border-radius:999px;padding:.8rem 1.5rem;display:block;margin:1rem auto 0}.chart-toggle:focus-visible,select:focus-visible{outline:3px solid #bc3b3b;outline-offset:3px}.chart-panel[hidden]{display:none}.chart-panel{position:relative;z-index:auto;width:min(90vw,700px);height:clamp(210px,32vh,320px);display:flex;flex-direction:column;text-align:left;background:rgba(255,255,255,.94);border-top:1px solid #eeeae6;padding-top:.7rem}.chart-header{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:1rem}.chart-header h2{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin:0}.chart-subtitle{color:#77716a;font-size:.72rem;letter-spacing:normal;text-transform:none;margin:0}.chart-subtitle select{font:inherit;color:#24211e;background:transparent;border:0;cursor:pointer}.chart-wrap{position:relative;flex:1;min-height:120px}.chart-wrap canvas{width:100%;height:100%;display:block}.chart-note{font-size:.65rem;line-height:1.3;color:#99918b;letter-spacing:normal;text-transform:none;margin:0 0 .3rem}.chart-open main{flex:1;padding:1rem;min-height:0}.chart-open .number{font-size:clamp(3.5rem,12vw,8rem)}.chart-open footer{padding:1rem 1rem 1.5rem}@media(max-width:600px){.chart-open .number{font-size:clamp(4rem,18vw,6rem)}.chart-panel{width:92vw;height:32vh}}



.unit{pointer-events:auto;border:0;padding:0;background:transparent;font-family:inherit;font-weight:inherit;line-height:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.unit:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:4px}.party #value,.party .unit{background:linear-gradient(90deg,#ff334c,#ffba08,#26ca73,#23aeec,#a94dff,#ff334c);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:rainbow-shift 1.6s linear infinite}.party-trail{position:fixed;z-index:2;pointer-events:none;object-fit:contain;opacity:.65;animation:trail-fade .8s ease-out forwards}@keyframes rainbow-shift{to{background-position:250% 0}}@keyframes trail-fade{to{opacity:0;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.party #value,.party .unit{animation:none}.party-trail{display:none}}

.secret-p{display:inline-block;text-transform:uppercase;font:inherit;font-size:1.18em;line-height:1;color:inherit;letter-spacing:inherit;border:0;padding:0;background:none;cursor:grab;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;transform:rotate(-6deg)}.secret-p.japan{transform:rotate(6deg)}.secret-p:focus-visible{outline:2px solid #bc3b3b;outline-offset:3px}.hammer-cursor{position:fixed;z-index:30;font-size:52px;line-height:1;pointer-events:none;transform:translate(-15%,-65%);filter:drop-shadow(0 3px 4px #0003)}.achievement{position:fixed;right:1rem;top:1rem;z-index:100;width:min(310px,calc(100vw - 2rem));background:#fff;border:1px solid #eadfd8;border-radius:14px;box-shadow:0 12px 35px #33221120;padding:1rem 1.15rem;text-align:left;color:#24211e}.achievement[hidden]{display:none}.achievement strong{display:block;font-size:.9rem;letter-spacing:0}.achievement p{margin:.35rem 0 0;color:#77716a;font-size:.78rem;line-height:1.4}.debris{position:fixed!important;margin:0!important;pointer-events:none!important;z-index:20!important;transform-origin:center!important}.restore-page{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:50;background:#fff;border:1px solid #d8d2cc;border-radius:999px;padding:.7rem 1rem;font:600 .75rem system-ui;cursor:pointer}

.face[hidden]{display:none}.mystery-search{display:flex;align-items:center;width:min(180px,65vw);margin:.75rem auto 0;border:1px solid #e5dfd9;border-radius:999px;background:#fff;overflow:hidden}.mystery-search input{width:100%;min-width:0;border:0;outline:0;padding:.55rem .3rem .55rem .8rem;font:400 .75rem system-ui;color:#24211e;background:transparent}.mystery-search input::placeholder{color:#aaa39c}.mystery-search.error{border-color:#bc3b3b}.mystery-search.error input::placeholder{color:#bc3b3b}.mystery-search button{border:0;background:transparent;color:#77716a;font-size:1rem;cursor:pointer;padding:.35rem .7rem}.mystery-search:focus-within{outline:2px solid #d5bbb6;outline-offset:2px}.chart-open footer{padding-bottom:.5rem}

.bouncing-emoji{position:fixed;left:0;top:0;z-index:3;pointer-events:none;user-select:none;font-size:clamp(2.5rem,9vw,4.5rem);line-height:1;will-change:transform}
</style>

<body><header><button class="sun" type="button" aria-label="Punto rojo"></button><h1><button class="secret-p" type="button" aria-label="P de Proyecto">P</button>royecto Ja<button class="secret-p japan" type="button" aria-label="P de Japón">p</button>ón</h1></header><main><div class="number" aria-label="Porcentaje actual"><span id="value">4,40</span><button class="unit" type="button" aria-label="Cambiar color del porcentaje">%</button></div></main><section class="chart-panel" id="chart-panel" hidden aria-label="Gráfica de evolución"><div class="chart-header"><h2>Evolución</h2><p class="chart-subtitle"><label for="chart-range">Velas: </label><select id="chart-range"><option value="1">1 minuto</option><option value="5">5 minutos</option><option value="15">15 minutos</option><option value="60" selected>1 hora</option><option value="240">4 horas</option><option value="1440">24 horas</option></select></p></div><div class="chart-wrap"><canvas id="chart" role="img" aria-label="Gráfica de velas del porcentaje registrado"></canvas></div><p class="chart-note">Historial de este navegador; los periodos sin datos se omiten.</p></section><footer>Un paso más cerca<button class="chart-toggle" type="button" aria-expanded="false" aria-controls="chart-panel">Gráfica</button><form class="mystery-search" role="search"><input type="search" aria-label="Buscar" placeholder="Buscar" autocomplete="off"><button type="submit" aria-label="Buscar">⌕</button></form></footer>
<button class="face" aria-label="Rebotar primera cara"><img src="face-1.png" alt="" draggable="false"></button><button class="face" aria-label="Rebotar segunda cara"><img src="face-2.png" alt="" draggable="false"></button><button class="face" aria-label="Rebotar tercera cara"><img src="face-3.png" alt="" draggable="false"></button><button class="face" aria-label="Rebotar cuarta cara" hidden><img src="face-4.png" alt="" draggable="false"></button>
<div class="achievement" role="status" aria-live="polite" hidden><strong></strong><p></p></div>
<script>
const ACHIEVEMENTS_KEY = 'proyecto-japon-achievements-v1';
const achievementNames = {cry:'hacerlos llorar',ball:'la pelota roja',throw:'lanzar las caras',dizzy:'marearlos',rainbow:'el modo multicolor',hammer:'el martillo',lolo:'la visita sorpresa',emoji:'los emojis'};
let achievements = {};
try { const saved=JSON.parse(localStorage.getItem(ACHIEVEMENTS_KEY)); if(saved && typeof saved==='object' && !Array.isArray(saved)) achievements=saved; } catch (_) {}
const achievementCard=document.querySelector('.achievement'), achievementQueue=[];
let achievementShowing=false;
function discover(id){
  if(!achievementNames[id]) return;
  achievements[id]=true;
  try { localStorage.setItem(ACHIEVEMENTS_KEY,JSON.stringify(achievements)); } catch (_) {}
  const found=Object.keys(achievementNames).filter(key=>achievements[key]).length;
  achievementQueue.push({name:achievementNames[id],found,total:Object.keys(achievementNames).length});
  showAchievement();
}
function showAchievement(){
  if(achievementShowing || !achievementQueue.length)return;
  achievementShowing=true;const item=achievementQueue.shift();
  achievementCard.querySelector('strong').textContent='¡Has encontrado un easter egg!';
  achievementCard.querySelector('p').textContent=item.name+' · Llevas '+item.found+' de '+item.total+'.';
  achievementCard.hidden=false;
  setTimeout(()=>{achievementCard.hidden=true;achievementShowing=false;showAchievement()},5000);
}
const percentButton = document.querySelector('.unit');
const percentColors = ['#bc3b3b','#2864b8','#27866a','#a449bd','#e68025','#d94a88'];
let percentColorIndex = 0;
percentButton.addEventListener('click', () => {
  if (document.body.classList.contains('party')) return;
  if (Math.random() < .1) {
    document.body.classList.add('party');
    discover('rainbow');
    percentButton.style.color = '';
    setTimeout(() => {
      document.body.classList.remove('party');
      percentButton.style.color = percentColors[percentColorIndex];
    }, 30000);
  } else {
    percentColorIndex = (percentColorIndex + 1 + Math.floor(Math.random()*(percentColors.length-1))) % percentColors.length;
    percentButton.style.color = percentColors[percentColorIndex];
  }
});
// El rastro es decorativo y solo existe mientras está activo el modo multicolor.
let trailHue = 0;
setInterval(() => {
  if (!document.body.classList.contains('party') || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  trailHue = (trailHue + 55) % 360;
  for (const face of document.querySelectorAll('.face')) {
    if(face.hidden) continue;
    const rect=face.getBoundingClientRect(), original=face.querySelector('img');
    const trail=document.createElement('img'); trail.className='party-trail'; trail.src=original.currentSrc || original.src; trail.alt=''; trail.setAttribute('aria-hidden','true');
    trail.style.left=rect.left+'px'; trail.style.top=rect.top+'px'; trail.style.width=rect.width+'px'; trail.style.height=rect.height+'px';
    trail.style.filter=`sepia(1) saturate(8) hue-rotate(${trailHue}deg)`;
    document.body.appendChild(trail); setTimeout(()=>trail.remove(),850);
  }
}, 140);
// La P se convierte en martillo al arrastrarla; el siguiente toque desordena la página.
const secretPs=document.querySelectorAll('.secret-p');
let hammer=null, hammerDrag=null, smashed=false, activeSecretP=null;
secretPs.forEach(secretP=>{
secretP.addEventListener('pointerdown',e=>{if(e.button!==0 || smashed)return;activeSecretP=secretP;secretP.setPointerCapture(e.pointerId);hammerDrag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};});
secretP.addEventListener('pointermove',e=>{
  if(!hammerDrag || hammerDrag.id!==e.pointerId)return;
  if(!hammerDrag.moved && Math.hypot(e.clientX-hammerDrag.x,e.clientY-hammerDrag.y)>8){
    hammerDrag.moved=true;secretP.style.opacity='0';hammer=document.createElement('span');hammer.className='hammer-cursor';hammer.textContent='🔨';hammer.setAttribute('aria-hidden','true');document.body.appendChild(hammer);
  }
  if(hammerDrag.moved){hammer.style.left=e.clientX+'px';hammer.style.top=e.clientY+'px'}
});
secretP.addEventListener('pointerup',e=>{if(!hammerDrag || hammerDrag.id!==e.pointerId)return;if(hammerDrag.moved){hammer.dataset.ready='true'}hammerDrag=null});
secretP.addEventListener('pointercancel',()=>{if(hammer){hammer.remove();hammer=null}secretP.style.opacity='';hammerDrag=null;activeSecretP=null});
});
document.addEventListener('pointermove',e=>{if(hammer && hammer.dataset.ready){hammer.style.left=e.clientX+'px';hammer.style.top=e.clientY+'px'}});
document.addEventListener('pointerdown',e=>{if(!hammer || !hammer.dataset.ready || smashed)return;e.preventDefault();e.stopPropagation();hammer.remove();hammer=null;if(activeSecretP)activeSecretP.style.opacity='';activeSecretP=null;breakPage();discover('hammer')},true);
function breakPage(){
  smashed=true;const pieces=[], originals=[];
  const addPiece=(node,rect)=>{
    if(!rect.width || !rect.height)return;
    const clone=node.cloneNode(true);clone.removeAttribute('id');clone.setAttribute('aria-hidden','true');clone.classList.add('debris');
    Object.assign(clone.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',transform:'none',visibility:'visible'});
    document.body.appendChild(clone);
    pieces.push({el:clone,x:rect.left,y:rect.top,w:rect.width,h:rect.height,vx:(Math.random()-.5)*300,vy:-100-Math.random()*260,angle:0,spin:(Math.random()-.5)*420});
  };
  const targets=[document.querySelector('h1'),document.querySelector('.sun'),document.querySelector('#value'),document.querySelector('.unit'),...document.querySelectorAll('.face'),document.querySelector('footer')];
  const graph=document.querySelector('.chart-panel');if(!graph.hidden)targets.push(graph);
  for(const node of targets){
    if(!node || getComputedStyle(node).visibility==='hidden')continue;
    if(node.id==='value' && node.firstChild && node.firstChild.nodeType===Node.TEXT_NODE){
      const text=node.firstChild, style=getComputedStyle(node);
      for(let i=0;i<text.length;i++){const range=document.createRange();range.setStart(text,i);range.setEnd(text,i+1);const digit=document.createElement('span');digit.textContent=text.data[i];Object.assign(digit.style,{font:style.font,letterSpacing:style.letterSpacing,lineHeight:style.lineHeight,color:style.color,whiteSpace:'pre'});addPiece(digit,range.getBoundingClientRect())}
    }else addPiece(node,node.getBoundingClientRect());
    originals.push({node,visibility:node.style.visibility});node.style.visibility='hidden';
  }
  let previous=null,active=true;
  function frame(t){if(!active)return;const dt=previous===null?0:Math.min((t-previous)/1000,.04);previous=t;
    for(const p of pieces){p.vy+=1000*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;
      const floor=Math.max(0,innerHeight-p.h),right=Math.max(0,innerWidth-p.w);
      if(p.y>floor){p.y=floor;p.vy*=-.35;p.vx*=.82;p.spin*=.7;if(Math.abs(p.vy)<25)p.vy=0}
      if(p.x<0||p.x>right){p.x=Math.max(0,Math.min(right,p.x));p.vx*=-.5}
      p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.el.style.transform=`rotate(${p.angle}deg)`;
    }requestAnimationFrame(frame)}
  const restore=document.createElement('button');restore.type='button';restore.className='restore-page';restore.textContent='Volver a montar';document.body.appendChild(restore);
  restore.addEventListener('click',()=>{active=false;pieces.forEach(p=>p.el.remove());originals.forEach(o=>o.node.style.visibility=o.visibility);restore.remove();smashed=false});
  requestAnimationFrame(frame);
}
const sun = document.querySelector('.sun');
let ball = null;
sun.addEventListener('click', () => {
  if (!ball) {
    discover('ball');
    const rect = sun.getBoundingClientRect();
    ball = {x:rect.left + rect.width/2 - 18, y:rect.top + rect.height/2 - 18, vx:0, vy:0, mode:'fall', last:null};
    document.body.appendChild(sun);
    sun.classList.add('active'); sun.setAttribute('aria-label','Pelota roja');
    sun.style.left=ball.x+'px'; sun.style.top=ball.y+'px';
    requestAnimationFrame(moveBall);
  } else if (ball.mode === 'rest') {
    discover('ball');
    ball.mode = 'play'; ball.vx = (Math.random()<.5?-1:1)*180; ball.vy = -330; ball.last = null;
    requestAnimationFrame(moveBall);
  }
});
function moveBall(time) {
  if (!ball || ball.mode === 'rest') return;
  const dt=ball.last===null?0:Math.min((time-ball.last)/1000,.04); ball.last=time;
  const maxX=Math.max(0,innerWidth-36), maxY=Math.max(0,innerHeight-36);
  if (ball.mode === 'fall') {
    ball.vy += 950*dt; ball.y += ball.vy*dt;
    if(ball.y>=maxY){ball.y=maxY;ball.vy=-ball.vy*.48;if(Math.abs(ball.vy)<65){ball.vy=0;ball.mode='rest'}}
  } else {
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x<=0||ball.x>=maxX){ball.x=Math.max(0,Math.min(maxX,ball.x));ball.vx*=-1}
    if(ball.y<=0||ball.y>=maxY){ball.y=Math.max(0,Math.min(maxY,ball.y));ball.vy*=-1}
  }
  ball.x=Math.max(0,Math.min(maxX,ball.x));ball.y=Math.max(0,Math.min(maxY,ball.y));
  sun.style.left=ball.x+'px';sun.style.top=ball.y+'px';
  if(ball.mode!=='rest')requestAnimationFrame(moveBall);
}
const faces = [...document.querySelectorAll('.face')].map((el,i)=>({el,x:0,y:0,vx:[85,-75,70,-80][i],vy:[68,82,-78,-65][i],initialized:false}));
const searchForm = document.querySelector('.mystery-search');
const searchInput = searchForm.querySelector('input');
// Nombres de emoji derivados de Unicode CLDR; licencia en UNICODE-LICENSE.txt.
const emojiFallback = {manzana:'🍎',arbol:'🌳',perro:'🐶',gato:'🐱',corazon:'❤️',sol:'☀️',luna:'🌙',flor:'🌸',casa:'🏠',coche:'🚗',avion:'✈️',japon:'🇯🇵'};
const emojiCatalog = fetch('emoji-es-v2.json').then(r => { if(!r.ok) throw new Error('No se pudo cargar el catálogo'); return r.json(); }).then(data=>Object.assign({},emojiFallback,data)).catch(() => emojiFallback);
function findEmoji(query,catalog){
  if(catalog[query]) return catalog[query];
  if(query.endsWith('es') && catalog[query.slice(0,-2)]) return catalog[query.slice(0,-2)];
  if(query.endsWith('s') && catalog[query.slice(0,-1)]) return catalog[query.slice(0,-1)];
  if(/[\p{Extended_Pictographic}\p{Regional_Indicator}\u20e3]/u.test(query)) {
    const oneGrapheme = typeof Intl.Segmenter !== 'function' || [...new Intl.Segmenter('es',{granularity:'grapheme'}).segment(query)].length===1;
    if(oneGrapheme) return query;
  }
  return null;
}
const emojiSprites=[];
function addEmoji(symbol){
  const el=document.createElement('span');el.className='bouncing-emoji';el.textContent=symbol;el.setAttribute('aria-hidden','true');document.body.appendChild(el);
  const sprite={el,x:Math.max(0,(innerWidth-el.offsetWidth)/2),y:Math.max(0,(innerHeight-el.offsetHeight)/2),vx:(Math.random()<.5?-1:1)*(80+Math.random()*65),vy:(Math.random()<.5?-1:1)*(70+Math.random()*65)};
  emojiSprites.push(sprite);el.style.transform=`translate(${sprite.x}px,${sprite.y}px)`;
  if(emojiSprites.length>50){emojiSprites.shift().el.remove()}
}
searchForm.addEventListener('submit', async e => {
  e.preventDefault();
  const query = searchInput.value.trim().toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(query === 'lolo') {
    faces[3].el.hidden=false;
    searchForm.classList.remove('error'); searchInput.value=''; searchInput.placeholder='Buscar';
    discover('lolo');
  } else {
    const catalog=await emojiCatalog;
    const emoji=query && findEmoji(query,catalog);
    if(emoji) { addEmoji(emoji); discover('emoji'); searchInput.value=''; searchInput.placeholder='Buscar'; searchForm.classList.remove('error'); }
    else { searchInput.value=''; searchInput.placeholder='Error'; searchForm.classList.add('error'); }
  }
});
searchInput.addEventListener('input',()=>{searchForm.classList.remove('error'); searchInput.placeholder='Buscar'});
// Precargar las expresiones para que aparezcan sin retrasos.
const surprisedFaces = ['face-1-surprised.png', 'face-2-surprised.png', 'face-3-surprised.png', 'face-4-surprised.png'];
const cryingFaces = ['face-1-crying.png', 'face-2-crying.png', 'face-3-crying.png', 'face-4-crying.png'];
const dizzyFaces = ['face-1-dizzy.png', 'face-2-dizzy.png', 'face-3-dizzy.png', 'face-4-dizzy.png'];
faces.forEach((f, i) => {
  f.image = f.el.querySelector('img'); f.normalSrc = f.image.getAttribute('src');
  f.surprisedSrc = surprisedFaces[i];
  const preload = new Image(); preload.src = f.surprisedSrc;
  f.cryingSrc = cryingFaces[i]; const cryingPreload = new Image(); cryingPreload.src = f.cryingSrc;
  f.dizzySrc = dizzyFaces[i]; const dizzyPreload = new Image(); dizzyPreload.src = f.dizzySrc;
  f.baseSpeed = Math.hypot(f.vx, f.vy);
});
function bounceEffect(f) {
  if (!f.crying && !f.dizzy) {
    f.image.src = f.surprisedSrc;
    clearTimeout(f.expressionTimer);
    f.expressionTimer = setTimeout(() => { f.image.src = f.normalSrc; }, 800);
  }
  f.el.classList.remove('hit'); void f.el.offsetWidth; f.el.classList.add('hit');
  const rect = f.el.getBoundingClientRect();
  const spark = document.createElement('span'); spark.className = 'spark';
  spark.style.left = (rect.left + rect.width / 2) + 'px'; spark.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.appendChild(spark); spark.addEventListener('animationend', () => spark.remove(), {once:true}); setTimeout(() => spark.remove(), 600);

let lastFrame;
function animate(time) {
  const dt = lastFrame === undefined ? 0 : Math.min((time-lastFrame)/1000,.05); lastFrame=time;

// Cambiar este valor cuando se reciba una nueva cifra en el chat.
const BASE = 4.4;
const KEY = 'proyecto-japon-v2-' + BASE;
const lower = Math.max(0, Math.round(BASE * 100) - 100);
const upper = Math.min(10000, Math.round(BASE * 100) + 100);
let value;
try { value = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
if (!Number.isInteger(value) || value < lower || value > upper) value = Math.round(BASE * 100);
// Velas reales de un minuto, compartidas entre los distintos valores base.
const HISTORY_KEY = 'proyecto-japon-candles-v1';
let candles = [];
try { const saved = JSON.parse(localStorage.getItem(HISTORY_KEY)); if (Array.isArray(saved)) candles = saved.filter(c => Number.isFinite(c.t) && [c.o,c.h,c.l,c.c].every(Number.isFinite)); } catch (_) {}
const panel = document.getElementById('chart-panel');
const toggle = document.querySelector('.chart-toggle');

function recordValue() {
  const t = Math.floor(Date.now() / 60000) * 60000;
  let candle = candles[candles.length - 1];
  if (!candle || candle.t !== t) { candle = {t, o:value, h:value, l:value, c:value}; candles.push(candle); }
  else { candle.h = Math.max(candle.h, value); candle.l = Math.min(candle.l, value); candle.c = value; }
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(candles)); } catch (_) {}
  if (!panel.hidden) drawChart();
}
function drawChart() {
  const canvas = document.getElementById('chart'), rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width*dpr); canvas.height = Math.round(rect.height*dpr);
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,left=55,right=15,top=20,bottom=38,plotW=w-left-right,plotH=h-top-bottom;
  const interval = Number(document.getElementById('chart-range').value);
  const bucket = interval * 60000;
  const grouped = new Map();
  for (const c of candles) { const t=Math.floor(c.t/bucket)*bucket; const g=grouped.get(t); if(g){g.h=Math.max(g.h,c.h);g.l=Math.min(g.l,c.l);g.c=c.c}else grouped.set(t,{...c,t}); }
  const visible=[...grouped.values()].sort((a,b)=>a.t-b.t);
  if (!visible.length) return;
  const start=visible[0].t, end=visible[visible.length-1].t;
  if (!visible.length) return;
  let min=Math.min(...visible.map(c=>c.l)),max=Math.max(...visible.map(c=>c.h));

  for(let i=0;i<=4;i++){let v=max-(max-min)*i/4,yy=y(v);ctx.strokeStyle='#eeeae6';ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.fillStyle='#77716a';ctx.fillText((v/100).toFixed(2).replace('.',',')+' %',left-6,yy)}
  const slot=Math.min(12,plotW/visible.length),bodyWidth=Math.max(.5,slot);
  const firstX=left+plotW-slot*visible.length;
  for(const [index,c] of visible.entries()){const x=firstX+(index+.5)*slot; const color=c.c>=c.o?'#268567':'#c34747';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();const a=y(c.o),b=y(c.c),bodyHeight=Math.max(4,Math.abs(a-b));ctx.fillRect(x-bodyWidth/2,(a+b-bodyHeight)/2,bodyWidth,bodyHeight)}
  ctx.fillStyle='#77716a';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillText(new Date(start).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),left,h-bottom+10);ctx.textAlign='right';ctx.fillText(new Date(end).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),w-right,h-bottom+10);
}
toggle.addEventListener('click',()=>{const opening=panel.hidden;panel.hidden=!opening;document.body.classList.toggle('chart-open',opening);toggle.setAttribute('aria-expanded',String(opening));toggle.textContent=opening?'Ocultar gráfica':'Gráfica';if(opening)drawChart()});
document.getElementById('chart-range').addEventListener('change',drawChart);
window.addEventListener('resize',()=>{if(!panel.hidden)drawChart()});
function showValue() {
  document.getElementById('value').textContent = (value / 100).toFixed(2).replace('.', ',');
  try { localStorage.setItem(KEY, JSON.stringify(value)); } catch (_) {}
  recordValue();
}
function step() {
  const r = Math.random();
  const magnitude = r < .90 ? 1 : r < .99 ? 2 : 3;
  let direction = Math.random() < .5 ? -1 : 1;
  if (value + direction * magnitude < lower || value + direction * magnitude > upper) direction *= -1;
  value = Math.max(lower, Math.min(upper, value + direction * magnitude));
  showValue();
}
showValue();
setInterval(step, 3000);
