<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>Proyecto Japón</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24211e;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center}header{padding:clamp(2.5rem,7vh,5rem) 1rem 0}h1{font-size:clamp(.85rem,2vw,1rem);letter-spacing:.25em;text-transform:uppercase;font-weight:600;margin:0}.sun{width:12px;height:12px;border-radius:50%;background:#bc3b3b;margin:0 auto 1.4rem}main{flex:1;display:grid;place-content:center;padding:1rem 1rem 10vh}.number{font-size:clamp(4rem,18vw,16rem);font-weight:700;line-height:1;letter-spacing:-.075em;font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:.34em;letter-spacing:0;margin-left:.1em;color:#bc3b3b}footer{padding:0 1rem 2.5rem;color:#77716a;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}

body{overflow:hidden} header,main,footer{position:relative;z-index:2;pointer-events:none}.face{position:fixed;left:0;top:0;width:clamp(70px, 11vw, 135px);height:clamp(70px, 11vw, 135px);z-index:3;will-change:transform;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;padding:0;border:0;background:transparent}.face img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px #0002)}.face.hit img{animation:squish .3s ease-out}.spark{position:fixed;width:18px;height:18px;border:2px solid #bc3b3b;border-radius:50%;pointer-events:none;z-index:3;animation:pop .45s ease-out forwards}@keyframes squish{0%{transform:scale(.72,1.18)}55%{transform:scale(1.13,.9)}100%{transform:scale(1)}}@keyframes pop{from{opacity:.8;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}@media(max-width:600px){.number{font-size:clamp(5rem,23vw,8.5rem)}.face{width:clamp(100px,25vw,145px);height:clamp(100px,25vw,145px)}}@media(prefers-reduced-motion:reduce){.face.hit img,.spark{animation:none}}
</style>
</head>
<body><header><div class="sun" aria-hidden="true"></div><h1>Proyecto Japón</h1></header><main><div class="number" aria-label="Porcentaje actual"><span id="value">4,00</span><span class="unit">%</span></div></main><footer>Un paso más cerca</footer>
<button class="face" aria-label="Rebotar primera cara"><img src="face-1.png" alt="" draggable="false"></button><button class="face" aria-label="Rebotar segunda cara"><img src="face-2.png" alt="" draggable="false"></button>
<script>
const faces = [...document.querySelectorAll('.face')].map((el,i)=>({el,x:0,y:0,vx:i ? -75 : 85,vy:i ? 82 : 68,initialized:false}));
// Precargar las expresiones para que aparezcan sin retrasos.
const surprisedFaces = ['face-1-surprised.png', 'face-2-surprised.png'];
faces.forEach((f, i) => {
  f.image = f.el.querySelector('img'); f.normalSrc = f.image.getAttribute('src');
  f.surprisedSrc = surprisedFaces[i];
  const preload = new Image(); preload.src = f.surprisedSrc;
});
function bounceEffect(f) {
  f.image.src = f.surprisedSrc;
  clearTimeout(f.expressionTimer);
  f.expressionTimer = setTimeout(() => { f.image.src = f.normalSrc; }, 800);
  f.el.classList.remove('hit'); void f.el.offsetWidth; f.el.classList.add('hit');
  const rect = f.el.getBoundingClientRect();
  const spark = document.createElement('span'); spark.className = 'spark';
  spark.style.left = (rect.left + rect.width / 2) + 'px'; spark.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.appendChild(spark); spark.addEventListener('animationend', () => spark.remove(), {once:true}); setTimeout(() => spark.remove(), 600);
}
faces.forEach(f => f.el.addEventListener('click', () => { f.vx *= -1; f.vy *= -1; bounceEffect(f); }));
let lastFrame;
function animate(time) {
  const dt = lastFrame === undefined ? 0 : Math.min((time-lastFrame)/1000,.05); lastFrame=time;
  for (const f of faces) {
    const w=f.el.offsetWidth,h=f.el.offsetHeight,maxX=Math.max(0,innerWidth-w),maxY=Math.max(0,innerHeight-h);
    if(!f.initialized){f.x=maxX*(f.vx>0?.12:.8);f.y=maxY*(f.vy>0?.15:.8);f.initialized=true}
    f.x+=f.vx*dt;f.y+=f.vy*dt;let hit=false;
    if(f.x<0||f.x>maxX){f.x=Math.max(0,Math.min(maxX,f.x));f.vx*=-1;hit=true}
    if(f.y<0||f.y>maxY){f.y=Math.max(0,Math.min(maxY,f.y));f.vy*=-1;hit=true}
    f.el.style.transform=`translate(${f.x}px,${f.y}px)`;
    if(hit) bounceEffect(f);
  }
  requestAnimationFrame(animate);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(animate);
else faces.forEach((f,i)=>{f.el.style.transform=`translate(${i?75:10}vw,70vh)`});

// Cambiar este valor cuando se reciba una nueva cifra en el chat.
const BASE = 4;
const KEY = 'proyecto-japon-v2-' + BASE;
const lower = Math.max(0, Math.round(BASE * 100) - 100);
const upper = Math.min(10000, Math.round(BASE * 100) + 100);
let value;
try { value = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
if (!Number.isInteger(value) || value < lower || value > upper) value = Math.round(BASE * 100);
function showValue() {
  document.getElementById('value').textContent = (value / 100).toFixed(2).replace('.', ',');
  try { localStorage.setItem(KEY, JSON.stringify(value)); } catch (_) {}
}
function step() {
  const r = Math.random();
  const magnitude = r < .90 ? 1 : r < .99 ? 2 : 3;
  let direction = Math.random() < .5 ? -1 : 1;
  if (value + direction * magnitude < lower || value + direction * magnitude > upper) direction *= -1;
  value = Math.max(lower, Math.min(upper, value + direction * magnitude));
  showValue();
}
showValue();
setInterval(step, 3000);
</script></body></html>
